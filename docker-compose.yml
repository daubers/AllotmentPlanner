x-backend: &backend
  build:
    context: ./backend
    target: dev
  env_file: .env
  volumes:
    - ./backend/allotment:/app/allotment
    - ./backend/migrations:/app/migrations
    - media:/data/media
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: allotment
      POSTGRES_PASSWORD: allotment
      POSTGRES_DB: allotment
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      # -h makes it check over the network: during first-time setup Postgres answers only on its socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U allotment"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Brings the database schema up to date, then exits. Everything that uses the database waits for
  # it, so `docker compose up` after a pull never meets a schema that is behind the code.
  migrate:
    build:
      context: ./backend
      target: dev
    env_file: .env
    command: flask db upgrade
    volumes:
      - ./backend/allotment:/app/allotment
      - ./backend/migrations:/app/migrations
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    <<: *backend
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/readyz"]
      interval: 10s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY: http://api:8000
    volumes:
      - ./frontend/src:/app/src
    ports: ["5173:5173"]
    depends_on: [api]

  worker:
    <<: *backend
    command: celery -A allotment.celery_app:celery worker -l INFO -E

  # Photogrammetry (OpenSfM + GDAL). Off by default because its image is large and the first build
  # takes a while. Start it with `make mapper` to let "Build map" jobs run; they queue until then.
  mapper:
    profiles: [mapping]
    build:
      context: ./backend
      dockerfile: ../worker/Dockerfile
    env_file: .env
    # The dev api/worker run as root and own the shared media volume, so the mapper must too to
    # write tiles there. (The published images all use the same unprivileged user.)
    user: root
    volumes:
      - ./backend/allotment:/app/allotment
      - media:/data/media
      - mapping:/data/mapping
      - models:/data/models  # recognition models, downloaded on first use
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  beat:
    <<: *backend
    command: celery -A allotment.celery_app:celery beat -l INFO

  flower:
    <<: *backend
    command: celery -A allotment.celery_app:celery flower --port=5555
    ports: ["5555:5555"]

  # --- observability profile: docker compose --profile observability up ---
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.53.0
    volumes: [./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports: ["3000:3000"]

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]

volumes:
  pgdata:
  media:
  mapping:
  models:
