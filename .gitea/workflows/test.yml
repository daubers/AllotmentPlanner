name: test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: ruff check backend
      - run: ruff format --check backend

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      # Unit tests run on SQLite. When the PostGIS models land (AM-3) add a
      # postgis/postgis:16-3.4 service container and set DATABASE_URL here.
      - run: pytest -q --cov=allotment
        working-directory: backend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose --profile observability config -q
