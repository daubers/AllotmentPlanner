name: test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No setup-python: parallel jobs race on the runner's shared /opt/hostedtoolcache,
      # and pip would otherwise see Debian's system packages. Use an isolated venv.
      - name: Install backend
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install -q -e "backend[dev]"
      - run: ruff check backend
      - run: ruff format --check backend

  test:
    # The postgis service image is amd64-only: arm64 runners also carry ubuntu-latest, so pin.
    runs-on: [ubuntu-latest, linux-amd64]
    timeout-minutes: 30
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: allotment
          POSTGRES_PASSWORD: allotment
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U allotment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://allotment:allotment@postgis:5432/allotment_test
    steps:
      - uses: actions/checkout@v4
      # No setup-python: parallel jobs race on the runner's shared /opt/hostedtoolcache,
      # and pip would otherwise see Debian's system packages. Use an isolated venv.
      - name: Install backend
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install -q -e "backend[dev]"
      # Tests need PostGIS (service above); conftest creates the allotment_test database.
      - run: pytest -q --cov=allotment
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Uses the runner's own Node (setup-node would race on the shared tool cache).
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generated API client is up to date
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts

  mobile:
    # Hermes' compiler (hermesc) is an x86-64 binary: arm64 runners also carry ubuntu-latest, so pin to amd64.
    runs-on: [ubuntu-latest, linux-amd64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The app bundles for Android and iOS
        run: CI=1 npx expo export --platform android --platform ios --output-dir /tmp/mobile-export
      - name: API types match the web app's
        run: diff src/api/schema.d.ts ../frontend/src/api/schema.d.ts

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose --profile observability config -q
      - run: make prod-config
