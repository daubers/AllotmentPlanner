name: test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No setup-python: parallel jobs race on the runner's shared /opt/hostedtoolcache,
      # and pip would otherwise see Debian's system packages. Use an isolated venv.
      - name: Install backend
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install -q -e "backend[dev]"
      - run: ruff check backend
      - run: ruff format --check backend

  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: allotment
          POSTGRES_PASSWORD: allotment
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U allotment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://allotment:allotment@postgis:5432/allotment_test
    steps:
      - uses: actions/checkout@v4
      # No setup-python: parallel jobs race on the runner's shared /opt/hostedtoolcache,
      # and pip would otherwise see Debian's system packages. Use an isolated venv.
      - name: Install backend
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install -q -e "backend[dev]"
      # Tests need PostGIS (service above); conftest creates the allotment_test database.
      - run: pytest -q --cov=allotment
        working-directory: backend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose --profile observability config -q
