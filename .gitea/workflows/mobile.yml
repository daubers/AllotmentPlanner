name: mobile

# The Android app, built from source and kept as a downloadable APK. It takes 10 to 20 minutes, so it
# runs for release tags and on request (Actions > mobile > Run workflow), not on every push; the fast
# checks (types, tests, bundling) are the `mobile` job in test.yml. iOS is not built here: it needs a
# macOS runner and an Apple developer account (see AM-63).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: mobile-${{ gitea.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # Gradle and the Kotlin daemon are hungry; the runner has memory to spare.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The setup action answers sdkmanager's licence prompts on stdin, which this runner's
      # containers do not pass through ("8 of 8 SDK package licenses not accepted"), so the accepted
      # licence hashes are put in place first. They are the public hashes every Android CI uses.
      - name: Accept the Android SDK licences
        run: |
          mkdir -p "$HOME/.android/sdk/licenses"
          printf '%s\n' 8933bad161af4178b1185d1a37fbf41ea5269c55 d56f5187479451eabf01fb78af6dfcb131a6481e 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$HOME/.android/sdk/licenses/android-sdk-license"
          printf '%s\n' 84831b9409646a918e30573bab4c9c91346d8abd > "$HOME/.android/sdk/licenses/android-sdk-preview-license"
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the APK
        run: scripts/build-android.sh
      # v3: Gitea's artifact server does not speak the v4 protocol.
      - uses: actions/upload-artifact@v3
        with:
          name: allotment-android
          path: mobile/dist/*.apk
          if-no-files-found: error
