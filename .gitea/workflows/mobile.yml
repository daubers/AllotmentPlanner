name: mobile

# The Android app, built from source and kept as a downloadable APK. It takes 10 to 20 minutes, so it
# runs for release tags and on request (Actions > mobile > Run workflow), not on every push; the fast
# checks (types, tests, bundling) are the `mobile` job in test.yml. iOS is not built here: it needs a
# macOS runner and an Apple developer account (see AM-63).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: mobile-${{ gitea.ref }}
  cancel-in-progress: false

jobs:
  android:
    # The Android toolchain is x86-64 only; arm64 runners also carry ubuntu-latest, so pin to amd64.
    runs-on: [ubuntu-latest, linux-amd64]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # Gradle and the Kotlin daemon are hungry; the runner has memory to spare.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # android-actions/setup-android fails on this runner: it feeds sdkmanager's licence prompts
      # through stdin, which the containers do not pass, and its --licenses pass also trips on
      # add-on licences the build never uses. So set the SDK up by hand; Gradle fetches the rest.
      - name: Set up the Android SDK
        run: |
          sdk="$HOME/.android/sdk"
          mkdir -p "$sdk/licenses" "$sdk/cmdline-tools"
          printf '%s\n' 8933bad161af4178b1185d1a37fbf41ea5269c55 d56f5187479451eabf01fb78af6dfcb131a6481e 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$sdk/licenses/android-sdk-license"
          printf '%s\n' 84831b9409646a918e30573bab4c9c91346d8abd > "$sdk/licenses/android-sdk-preview-license"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          rm -rf "$sdk/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools "$sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      # Types and tests already ran in test.yml's `mobile` job for this tag.
      - run: npm ci
      # The release signing key lives in OpenBao (env/shell/android-signing). BAO_CI_TOKEN is a periodic
      # token that can read only that path. Each run renews it, and renew-bao-token.yml does too on the
      # 1st and 15th. If it ever lapses, make a new one (docs/ci.md). Without the token the debug key is used.
      - name: Fetch the release signing key
        env:
          BAO_CI_TOKEN: ${{ secrets.BAO_CI_TOKEN }}
        run: |
          if [ -z "$BAO_CI_TOKEN" ]; then echo "No BAO_CI_TOKEN: the APK will be signed with the debug key"; exit 0; fi
          addr=https://vault.daubney.dev
          curl -fsS -X POST -H "X-Vault-Token: $BAO_CI_TOKEN" "$addr/v1/auth/token/renew-self" -o /dev/null
          curl -fsS -H "X-Vault-Token: $BAO_CI_TOKEN" "$addr/v1/env/data/shell/android-signing" -o /tmp/signing.json
          for k in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            v="$(python3 -c "import json,sys; print(json.load(open('/tmp/signing.json'))['data']['data'][sys.argv[1]])" "$k")"
            echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_ENV"
          done
          rm -f /tmp/signing.json
      - name: Build the APK
        run: scripts/build-android.sh
      # Keep the APK on the ProGet "allotment-apps" asset directory so it can be downloaded on the
      # phone: a stable link (latest.apk) plus one copy per build.
      - name: Publish the APK to pkgs.daubney.dev
        env:
          PKGS_API_KEY: ${{ secrets.PKGS_API_KEY }}
        run: |
          apk="$(ls dist/*.apk | head -n1)"
          base="https://pkgs.daubney.dev/endpoints/allotment-apps/content"
          for name in "$(basename "$apk")" latest.apk; do
            # ProGet refuses to overwrite an asset ("already exists"), so clear the old one first. A missing one is fine.
            curl -sS -o /dev/null -X DELETE -H "X-ApiKey: $PKGS_API_KEY" "$base/$name" || true
            curl -fsS -X PUT -H "X-ApiKey: $PKGS_API_KEY" --data-binary "@$apk" "$base/$name"
          done
          echo "Published: $base/latest.apk"
      # v3: Gitea's artifact server does not speak the v4 protocol.
      - uses: actions/upload-artifact@v3
        with:
          name: allotment-android
          path: mobile/dist/*.apk
          if-no-files-found: error
