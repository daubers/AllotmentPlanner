name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: build-${{ gitea.ref }}
  cancel-in-progress: false

jobs:
  # Gitea cannot depend on another workflow, so repeat the fast test gate.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No setup-python: parallel jobs race on the runner's shared /opt/hostedtoolcache,
      # and pip would otherwise see Debian's system packages. Use an isolated venv.
      - name: Install backend
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install -q -e "backend[dev]"
      - run: pytest -q
        working-directory: backend

  image:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Add `frontend` (AM-3) and `worker` (AM-9) here as they are created.
        include:
          - name: allotment-api
            context: backend
            target: prod
    steps:
      - uses: actions/checkout@v4

      - name: Work out registry host
        id: reg
        run: |
          host="${{ gitea.server_url }}"
          host="${host#http://}"; host="${host#https://}"
          echo "host=${host}" >> "$GITHUB_OUTPUT"
          echo "image=${host}/$(echo '${{ gitea.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # GITEA_TOKEN usually lacks write:package; use a PAT stored as REGISTRY_TOKEN.
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.host }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.reg.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.reg.outputs.image }}:buildcache,mode=max
