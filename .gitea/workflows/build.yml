name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: build-${{ gitea.ref }}
  cancel-in-progress: false

jobs:
  # Gitea cannot depend on another workflow, so repeat the fast test gate.
  gate:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: allotment
          POSTGRES_PASSWORD: allotment
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U allotment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://allotment:allotment@postgis:5432/allotment_test
    steps:
      - uses: actions/checkout@v4
      # No setup-python: parallel jobs race on the runner's shared /opt/hostedtoolcache,
      # and pip would otherwise see Debian's system packages. Use an isolated venv.
      - name: Install backend
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install -q -e "backend[dev]"
      - run: pytest -q
        working-directory: backend

  image:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: allotment-api
            context: backend
            target: prod
          - name: allotment-frontend
            context: frontend
            target: prod
          # OpenSfM + GDAL mapping worker. OpenSfM is compiled from source in a build stage
          # (about 5 minutes on the runner, every build). Cache mode `min` exports only the final
          # image's layers: with `max` the build stage's multi-hundred-MB layers are uploaded too,
          # and the registry's reverse proxy rejects them with 413. `file` is workspace-relative.
          - name: allotment-worker
            context: backend
            file: worker/Dockerfile
            cache_mode: min
    steps:
      - uses: actions/checkout@v4

      - name: Work out registry host
        id: reg
        run: |
          host="${{ gitea.server_url }}"
          host="${host#http://}"; host="${host#https://}"
          echo "host=${host}" >> "$GITHUB_OUTPUT"
          echo "image=${host}/$(echo '${{ gitea.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # GITEA_TOKEN usually lacks write:package; use a PAT stored as REGISTRY_TOKEN.
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.host }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.reg.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.reg.outputs.image }}:buildcache,mode=${{ matrix.cache_mode || 'max' }}

  # Release tags only: once the test workflow for the same tag is green too, start the deploy in
  # matt/Allotment-Deploy (Gitea cannot trigger one repo's workflow from another's tags). That
  # workflow re-checks the commit is on main and both workflows succeeded before touching the host.
  trigger-deploy:
    needs: image
    if: ${{ gitea.event_name == 'push' && startsWith(gitea.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the deploy
        env:
          TAG: ${{ gitea.ref_name }}
          SHA: ${{ gitea.sha }}
          API: ${{ gitea.server_url }}/api/v1
          REPO: ${{ gitea.repository }}
          TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          set -eu
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unexpected tag $TAG"; exit 1 ;;
          esac
          rest="${TAG#v}"
          # X.Y.Z only: pre-releases such as v1.0.0-rc1 are built but never deployed.
          if ! printf '%s' "$rest" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$TAG is not a plain X.Y.Z release; not deploying"; exit 0
          fi
          # Wait up to 30 minutes for the test workflow on this tag.
          for i in $(seq 1 90); do
            state=$(curl -fsS -H "Authorization: token $TOKEN" "$API/repos/$REPO/actions/runs?head_sha=$SHA&limit=50" |
              TAG="$TAG" python3 -c '
          import json, os, sys
          runs = [r for r in json.load(sys.stdin).get("workflow_runs", []) if r.get("path") == "test.yml@refs/tags/" + os.environ["TAG"]]
          if not runs: print("pending")
          elif any(r.get("status") != "completed" and not r.get("conclusion") for r in runs): print("pending")
          else: print("ok" if all(r.get("conclusion") == "success" for r in runs) else "failed")')
            echo "test workflow: $state"
            [ "$state" = ok ] && break
            [ "$state" = failed ] && { echo "test workflow failed; not deploying"; exit 1; }
            sleep 20
          done
          [ "$state" = ok ] || { echo "timed out waiting for the test workflow"; exit 1; }
          curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"ref\":\"main\",\"inputs\":{\"tag\":\"$TAG\",\"sha\":\"$SHA\"}}" \
            "$API/repos/matt/Allotment-Deploy/actions/workflows/deploy.yml/dispatches"
          echo "deploy of $TAG dispatched"
