# The mapping worker (photo mapping + object recognition) on a SEPARATE machine, ideally one with a
# GPU. The main server keeps the API, web app, database and Redis; this machine only runs Celery
# jobs from the `mapping` queue and reaches everything over the LAN. See the README, "GPU worker".
#
#   cp .env.gpu-worker.example .env.gpu-worker         # then edit it
#   ./build-gpu-worker.sh                              # builds the image here (reads TORCH_INDEX)
#   # then start it with the GPU file that matches the card (or none, for CPU only):
#   docker compose --env-file .env.gpu-worker -f docker-compose.gpu-worker.yml -f docker-compose.gpu-worker.amd.yml up -d
#   docker compose --env-file .env.gpu-worker -f docker-compose.gpu-worker.yml -f docker-compose.gpu-worker.nvidia.yml up -d
#
# The image is built on this machine, not pulled: the GPU builds of PyTorch are several GB and the
# registry in front of the CI images refuses layers that large.
# Do not also run the main server's `--profile mapping` mapper, or the two would share the queue.

name: allotment-gpu

x-env: &env
  DATABASE_URL: postgresql+psycopg://allotment:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@${MAIN_SERVER:?set MAIN_SERVER}:5432/allotment
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@${MAIN_SERVER}:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY (same as the main server)}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
  # Photos and map tiles live in the main server's S3 (SeaweedFS); nothing is shared as a volume.
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://${MAIN_SERVER}:${S3_PORT:-9000}
  S3_BUCKET: ${S3_BUCKET:-allotment-media}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  TORCH_DEVICE: ${TORCH_DEVICE:-auto}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  FLASK_APP: allotment:create_app
  HOME: /tmp

services:
  mapper:
    image: allotment-worker-gpu:${TAG:-local}
    environment: *env
    restart: unless-stopped
    volumes:
      - mapping:/data/mapping   # scratch space for a job
      - models:/data/models     # recognition models (about 1.3 GB), downloaded on first use

volumes:
  mapping:
  models:
