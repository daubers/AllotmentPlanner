# Add-on for the MAIN server when a worker runs on another machine (see README, "GPU worker"):
# publishes Redis and Postgres on the LAN address only, puts a password on Redis, and runs an S3 service
# (SeaweedFS) so photos and map tiles no longer need a volume both machines can see.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.lan.yml up -d
#
# In .env set: LAN_IP, REDIS_PASSWORD, REDIS_URL=redis://:<REDIS_PASSWORD>@redis:6379/0,
# STORAGE_BACKEND=s3, S3_ENDPOINT_URL=http://s3:9000, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY.
# Nothing here is for the internet: keep these ports closed on your router, and allow only the
# worker's address through the server's firewall.

services:
  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${LAN_IP:?set LAN_IP in .env}:6379:6379"

  db:
    ports:
      - "${LAN_IP:?set LAN_IP in .env}:5432:5432"

  # S3-compatible storage for photos and map tiles. (MinIO no longer publishes images, so this is
  # SeaweedFS; any S3 service works: just set the S3_* settings to point at it.) The access key
  # and secret are written into its config at start-up; the bucket is created on first use.
  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"allotment","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env (8 or more characters)}
    volumes:
      - s3data:/data
    ports:
      - "${LAN_IP:?set LAN_IP in .env}:9000:9000"
    healthcheck:
      # curl succeeds on any HTTP reply (the S3 port answers 403 without credentials)
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/"]
      interval: 10s
      retries: 20

volumes:
  s3data:
