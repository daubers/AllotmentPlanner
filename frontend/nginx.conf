server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    # Override by mounting your own conf if the API lives elsewhere.
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    # Uploads can be a GoPro chapter (about 4 GB): keep this at least MAX_UPLOAD_MB in the API,
    # and stream the body through rather than buffering it to disk first.
    client_max_body_size 4g;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    try_files $uri /index.html;
  }
}
